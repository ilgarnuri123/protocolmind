<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProtocolMind</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:26px;
font-weight:bold;
}

select{
padding:6px;
border-radius:6px;
background:#1e293b;
color:white;
border:none;
}
  .chat{
background:#1e293b;
padding:20px;
border-radius:12px;
min-height:350px;
margin-bottom:15px;
}

.message{
margin-bottom:12px;
line-height:1.5;
}

.user{
color:#60a5fa;
}

.assistant{
color:#22c55e;
}

.inputbox{
display:flex;
gap:10px;
}

input{
flex:1;
padding:12px;
border-radius:10px;
border:none;
background:#020617;
color:white;
}

button{
padding:12px 16px;
border-radius:10px;
border:none;
background:#22c55e;
color:white;
cursor:pointer;
}

.auth-card{
background:#111827;
padding:30px;
border-radius:16px;
max-width:420px;
margin:20px auto;
display:flex;
flex-direction:column;
gap:15px;
}
  .auth-title{
text-align:center;
font-size:20px;
font-weight:600;
}

.auth-input{
padding:12px;
border-radius:10px;
border:1px solid #334155;
background:#020617;
color:white;
font-size:14px;
}

.auth-btn{
padding:12px;
border-radius:10px;
border:none;
background:#22c55e;
color:white;
font-weight:600;
cursor:pointer;
}

.auth-divider{
text-align:center;
color:#64748b;
font-size:14px;
}

.auth-social{
display:flex;
flex-direction:column;
gap:10px;
}

.auth-social-btn{
padding:12px;
border-radius:10px;
background:#1e293b;
border:none;
color:white;
cursor:pointer;
}

.logout-btn{
margin-top:10px;
background:#ef4444;
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="title">ProtocolMind</div>

<select id="languageSelect">

<option>English</option>
<option>Русский</option>
<option>Azərbaycan dili</option>
<option>Türkçe</option>
<option>ქართული</option>

</select>

</div>
<div class="auth-card">

<h2 class="auth-title">Sign in to ProtocolMind</h2>

<input 
id="emailInput"
class="auth-input"
type="email"
placeholder="Enter your email"
/>

<button class="auth-btn" onclick="signInEmail()">
Continue with Email
</button>

<div class="auth-divider">or</div>

<div class="auth-social">

<button class="auth-social-btn" onclick="loginGoogle()">
Continue with Google
</button>

<button class="auth-social-btn" onclick="loginMicrosoft()">
Continue with Microsoft
</button>

</div>

<button class="logout-btn" onclick="signOutUser()">
Logout
</button>

</div>

<div id="chat" class="chat">

<div class="message assistant">
Welcome to ProtocolMind. Ask about diplomatic protocol.
</div>

</div>

<div class="inputbox">

<input id="question" placeholder="Ask a protocol question...">

<button onclick="ask()">Ask</button>

<button onclick="saveDocument()">Save</button>

</div>
<script>

const SUPABASE_URL="https://qzpyjgugpisphmajzrnk.supabase.co"
const SUPABASE_KEY="sb_publishable_QDnJlAuWQOVa__5slH5MNg_RWE_QeeW"

const supabaseClient=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
)

let lastAnswer=""
let userEmail=""

async function signInEmail(){

const email=document.getElementById("emailInput").value

if(!email){
alert("Enter email")
return
}

const {error}=await supabaseClient.auth.signInWithOtp({
email:email
})

if(error){
alert(error.message)
}else{
alert("Check your email for login link")
}

}

async function loginGoogle(){

await supabaseClient.auth.signInWithOAuth({
provider:"google"
})

}

async function loginMicrosoft(){

await supabaseClient.auth.signInWithOAuth({
provider:"azure"
})

}

async function signOutUser(){

await supabaseClient.auth.signOut()
location.reload()

}
  async function ask(){

const q=document.getElementById("question").value.trim()

if(!q) return

const chat=document.getElementById("chat")

chat.innerHTML+=`<div class="message user">${q}</div>`

document.getElementById("question").value=""

const res=await fetch("/api/ask",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
question:q,
userEmail:userEmail
})
})

const data=await res.json()

const answer=
data.answer||
data.response||
data.result||
"Server returned no answer"

lastAnswer=answer

chat.innerHTML+=`<div class="message assistant">${answer}</div>`

chat.scrollTop=chat.scrollHeight

}

async function saveDocument(){

if(!lastAnswer){
alert("Nothing to save")
return
}

await fetch("/api/save-document",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
userEmail:userEmail,
title:"AI document",
type:"AI",
content:lastAnswer
})
})

}

document.getElementById("question").addEventListener("keydown",function(e){
if(e.key==="Enter"){
ask()
}
})

</script>

</body>
</html>
