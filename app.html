<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProtocolMind</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Inter;
background:#0b1220;
color:white;
margin:0;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
border-bottom:1px solid #1f2937;
}

.logo{
font-size:22px;
font-weight:600;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.messages{
height:60vh;
overflow-y:auto;
background:#111827;
padding:20px;
border-radius:10px;
}

.message{
margin-bottom:15px;
}

.user{
color:#eab308;
}

.assistant{
color:white;
}

.input-area{
display:flex;
gap:10px;
margin-top:15px;
}

textarea{
flex:1;
padding:12px;
background:#1f2937;
border:none;
border-radius:8px;
color:white;
resize:none;
}

button{
background:#eab308;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}

.mode{
margin-bottom:20px;
}

select{
background:#111827;
color:white;
padding:6px;
}

</style>

</head>

<body>

<div class="header">

<div class="logo">ProtocolMind</div>

<div class="mode">

<select id="modeSelect">
<option>Protocol Advice</option>
<option>Seating Plan</option>
<option>Visit Program</option>
<option>Official Letter</option>
<option>Checklist</option>
</select>

</div>

</div>

<div class="container">

<div class="messages" id="messages"></div>

<div class="input-area">

<textarea id="userInput" rows="2" placeholder="Ask ProtocolMind..."></textarea>

<button id="sendBtn">Send</button>

</div>

</div>
<script>

const messages=document.getElementById("messages");
const input=document.getElementById("userInput");
const modeSelect=document.getElementById("modeSelect");

let chatMemory=[];

function addMessage(role,text){

const div=document.createElement("div");

div.classList.add("message");
div.classList.add(role);

div.innerText=text;

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

}
  async function askProtocolMind(prompt){

const response=await fetch("/api/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

mode:modeSelect.value,

messages:[
...chatMemory,
{role:"user",content:prompt}
]

})

});

const data=await response.json();

return data.answer;

}
  document.getElementById("sendBtn").addEventListener("click",async()=>{

const text=input.value.trim();

if(!text) return;

addMessage("user",text);

chatMemory.push({role:"user",content:text});

input.value="";

const answer=await askProtocolMind(text);

addMessage("assistant",answer);

chatMemory.push({role:"assistant",content:answer});

});

input.addEventListener("keydown",function(e){

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

document.getElementById("sendBtn").click();

}

});

</script>

</body>
</html>
