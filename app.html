<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProtocolMind</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Inter;
background:#0b1220;
color:white;
margin:0;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
border-bottom:1px solid #1f2937;
}

.logo{
font-size:22px;
font-weight:600;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.messages{
height:60vh;
overflow-y:auto;
background:#111827;
padding:20px;
border-radius:10px;
}

.message{
margin-bottom:15px;
}

.user{
color:#eab308;
}

.assistant{
color:white;
}

.input-area{
display:flex;
gap:10px;
margin-top:15px;
}

textarea{
flex:1;
padding:12px;
background:#1f2937;
border:none;
border-radius:8px;
color:white;
resize:none;
}

button{
background:#eab308;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}

.auth{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0b1220;
display:flex;
align-items:center;
justify-content:center;
}

.auth-box{
background:#111827;
padding:40px;
border-radius:10px;
width:300px;
}

.auth-box input{
width:100%;
padding:10px;
margin-bottom:10px;
background:#1f2937;
border:none;
color:white;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="auth" id="authScreen">

<div class="auth-box">

<h2>ProtocolMind Login</h2>

<input id="emailInput" placeholder="Enter email">

<button id="magicLinkBtn">Send Magic Link</button>

</div>

</div>

<div class="header">

<div class="logo">ProtocolMind</div>

<button id="logoutBtn">Logout</button>

</div>

<div class="container">

<div class="messages" id="messages"></div>

<div class="input-area">

<textarea id="userInput" rows="2"></textarea>

<button id="sendBtn">Send</button>

</div>

</div>
<script>

const SUPABASE_URL="https://qzpyjgugpisphmajzrnk.supabase.co";

const SUPABASE_ANON_KEY="sb_publishable_QDnJlAuWQOVa__5slH5MNg_RWE_QeeW";

const supabase=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const authScreen=document.getElementById("authScreen");
const messages=document.getElementById("messages");
const input=document.getElementById("userInput");

let chatMemory=[];

function addMessage(role,text){

const div=document.createElement("div");

div.classList.add("message");

div.classList.add(role);

div.innerText=text;

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

}
  async function askProtocolMind(prompt){

const response=await fetch("/api/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

messages:[
...chatMemory,
{role:"user",content:prompt}
]

})

});

const data=await response.json();

return data.answer;

}

document.getElementById("sendBtn").addEventListener("click",async()=>{

const text=input.value.trim();

if(!text) return;

addMessage("user",text);

chatMemory.push({role:"user",content:text});

input.value="";

const answer=await askProtocolMind(text);

addMessage("assistant",answer);

chatMemory.push({role:"assistant",content:answer});

});
  document.getElementById("magicLinkBtn").addEventListener("click",async()=>{

const email=document.getElementById("emailInput").value.trim();

if(!email){
alert("Enter email");
return;
}

const {error}=await supabase.auth.signInWithOtp({

email:email,

options:{
emailRedirectTo:window.location.origin+"/app.html"
}

});

if(error){
alert(error.message);
return;
}

alert("Magic link sent. Check email.");

});

async function checkSession(){

const {data}=await supabase.auth.getSession();

if(data.session){

authScreen.classList.add("hidden");

}else{

authScreen.classList.remove("hidden");

}

}

checkSession();

document.getElementById("logoutBtn").addEventListener("click",async()=>{

await supabase.auth.signOut();

authScreen.classList.remove("hidden");

});

input.addEventListener("keydown",function(e){

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

document.getElementById("sendBtn").click();

}

});

</script>

</body>
</html>
