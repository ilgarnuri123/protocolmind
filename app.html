<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProtocolMind</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:26px;
font-weight:bold;
}

select{
padding:6px;
border-radius:6px;
}

.chat{
background:#1e293b;
padding:20px;
border-radius:10px;
min-height:350px;
margin-bottom:15px;
}

.message{
margin-bottom:12px;
}

.user{
color:#60a5fa;
}

.assistant{
color:#22c55e;
}

.inputbox{
display:flex;
gap:10px;
}

input{
flex:1;
padding:10px;
border-radius:8px;
border:none;
}

button{
padding:10px 16px;
border-radius:8px;
border:none;
background:#22c55e;
color:white;
cursor:pointer;
}

.documents{
margin-top:30px;
background:#1e293b;
padding:15px;
border-radius:10px;
}

.doc{
background:#334155;
padding:10px;
margin-bottom:8px;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="title">ProtocolMind</div>

<select id="languageSelect" onchange="updateLanguage()">

<option value="English">English</option>
<option value="Русский">Русский</option>
<option value="Azərbaycan dili">Azərbaycan dili</option>
<option value="Türkçe">Türkçe</option>
<option value="ქართული">ქართული</option>

</select>

</div>
<div id="chat" class="chat">

<div class="message assistant" id="welcome">
Welcome to ProtocolMind. Ask about diplomatic protocol.
</div>

</div>

<div class="inputbox">

<input id="question" placeholder="Ask a protocol question...">

<button onclick="ask()">Ask</button>

<button onclick="saveDocument()">Save</button>

</div>

<div class="documents">

<h3>My Documents</h3>

<div id="docs"></div>

</div>

</div>

<script>

const SUPABASE_URL = "https://qzpyjgugpisphmajzrnk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QDnJlAuWQOVa__5slH5MNg_RWE_QeeW";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let lastAnswer = "";
let userEmail = "";

async function loadUser(){

const { data } = await supabaseClient.auth.getUser();

if(data?.user){

userEmail = data.user.email;

loadDocuments();

}

}
const translations = {

English:{
welcome:"Welcome to ProtocolMind. Ask about diplomatic protocol.",
placeholder:"Ask about diplomatic protocol..."
},

Русский:{
welcome:"Добро пожаловать в ProtocolMind. Спросите о дипломатическом протоколе.",
placeholder:"Задайте вопрос..."
},

"Azərbaycan dili":{
welcome:"ProtocolMind-ə xoş gəlmisiniz. Diplomatik protokol barədə soruşun.",
placeholder:"Protokol barədə sual verin..."
},

Türkçe:{
welcome:"ProtocolMind'e hoş geldiniz. Diplomatik protokol hakkında sorabilirsiniz.",
placeholder:"Protokol hakkında sorun..."
},

ქართული:{
welcome:"კეთილი იყოს თქვენი მობრძანება ProtocolMind-ში.",
placeholder:"დასვით კითხვა..."
}

};

function updateLanguage(){

const lang = document.getElementById("languageSelect").value;

document.getElementById("welcome").innerText =
translations[lang].welcome;

document.getElementById("question").placeholder =
translations[lang].placeholder;

}

async function ask(){

const q = document.getElementById("question").value;

if(!q) return;

const chat = document.getElementById("chat");

chat.innerHTML += `<div class="message user">${q}</div>`;

document.getElementById("question").value="";

const res = await fetch("/api/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:q,
userEmail:userEmail
})

});

const data = await res.json();

lastAnswer = data.answer;

chat.innerHTML += `<div class="message assistant">${data.answer}</div>`;

chat.scrollTop = chat.scrollHeight;

}
  async function saveDocument(){

if(!lastAnswer){

alert("Nothing to save");

return;

}

const title = prompt("Document title");

if(!title) return;

await fetch("/api/save-document",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
userEmail:userEmail,
title:title,
type:"AI Document",
content:lastAnswer
})

});

loadDocuments();

}

async function loadDocuments(){

const res = await fetch("/api/get-documents",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
userEmail:userEmail
})

});

const data = await res.json();

const docs = document.getElementById("docs");

docs.innerHTML="";

data.documents.forEach(d=>{

const el = document.createElement("div");

el.className="doc";

el.innerText=d.title;

el.onclick=()=>{

document.getElementById("chat").innerHTML +=
`<div class="message assistant">${d.content}</div>`;

};

docs.appendChild(el);

});

}

loadUser();

</script>

</body>
</html>
