<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProtocolMind App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0b1220;
color:white;
}

.app{
max-width:1000px;
margin:auto;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:28px;
font-weight:bold;
}

.controls{
display:flex;
gap:10px;
}

select{
padding:8px;
border-radius:6px;
}

.chat{
background:#111827;
padding:20px;
border-radius:12px;
min-height:400px;
margin-bottom:20px;
}

.message{
margin-bottom:14px;
}

.user{
color:#60a5fa;
}

.assistant{
color:#22c55e;
}

.inputbox{
display:flex;
gap:10px;
}

input{
flex:1;
padding:12px;
border-radius:8px;
border:none;
}

button{
padding:12px 18px;
border-radius:8px;
border:none;
background:#22c55e;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

<div class="title">ProtocolMind</div>

<div class="controls">

<select id="languageSelect" onchange="updateLanguage()">

<option value="English">English</option>
<option value="Azərbaycan dili">Azərbaycan dili</option>
<option value="Русский">Русский</option>
<option value="Türkçe">Türkçe</option>
<option value="ქართული">ქართული</option>

</select>

</div>

</div>

<div id="chat" class="chat">

<div class="message assistant" id="welcome">
Welcome to ProtocolMind. Ask about diplomatic protocol, official visits, seating plans or protocol packs.
</div>

</div>

<div class="inputbox">

<input id="question" placeholder="Ask about diplomatic protocol...">

<button onclick="ask()">Ask</button>

</div>

</div>

<script>

let language="English";

const translations={

English:{
welcome:"Welcome to ProtocolMind. Ask about diplomatic protocol, official visits, seating plans or protocol packs.",
placeholder:"Ask about diplomatic protocol..."
},

"Русский":{
welcome:"Добро пожаловать в ProtocolMind. Спросите о дипломатическом протоколе, официальных визитах и рассадке.",
placeholder:"Задайте вопрос о протоколе..."
},

"Azərbaycan dili":{
welcome:"ProtocolMind-ə xoş gəlmisiniz. Diplomatik protokol və rəsmi səfərlər barədə soruşun.",
placeholder:"Protokol barədə sual verin..."
},

"Türkçe":{
welcome:"ProtocolMind'e hoş geldiniz. Diplomatik protokol hakkında soru sorabilirsiniz.",
placeholder:"Protokol hakkında sorun..."
},

"ქართული":{
welcome:"კეთილი იყოს თქვენი მობრძანება ProtocolMind-ში. ჰკითხეთ დიპლომატიურ პროტოკოლზე.",
placeholder:"დასვით კითხვა პროტოკოლზე..."
}

};

function updateLanguage(){

language=document.getElementById("languageSelect").value;

document.getElementById("welcome").innerText=
translations[language].welcome;

document.getElementById("question").placeholder=
translations[language].placeholder;

}
  async function ask(){

const q=document.getElementById("question").value;

if(!q) return;

const chat=document.getElementById("chat");

chat.innerHTML+=`
<div class="message user">${q}</div>
`;

document.getElementById("question").value="";

try{

const res=await fetch("/api/ask",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
question:q,
language:language
})
});

const data=await res.json();

chat.innerHTML+=`
<div class="message assistant">${data.answer}</div>
`;

chat.scrollTop=chat.scrollHeight;

}catch(e){

chat.innerHTML+=`
<div class="message assistant">Error contacting server</div>
`;

}

}

</script>

</body>
</html>
