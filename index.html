<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ProtocolMind</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
}

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

h1{
text-align:center;
}

.subtitle{
text-align:center;
color:#cbd5e1;
}

.credits{
text-align:center;
color:#94a3b8;
margin-bottom:20px;
}

.chat-box{
background:#111827;
border-radius:12px;
padding:20px;
min-height:420px;
max-height:600px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
border:1px solid #334155;
}

.message{
padding:12px;
border-radius:8px;
max-width:75%;
}

.user{
background:#2563eb;
align-self:flex-end;
}

.assistant{
background:#1f2937;
align-self:flex-start;
}

.input-row{
display:flex;
gap:10px;
margin-top:15px;
}

input{
flex:1;
padding:14px;
border-radius:10px;
border:none;
}

button{
padding:14px 18px;
border:none;
border-radius:10px;
cursor:pointer;
}

.ask-btn{
background:#22c55e;
color:white;
}

.clear-btn{
background:#475569;
color:white;
}

.upgrade{
text-align:center;
margin-bottom:25px;
}

.upgrade button{
background:#22c55e;
font-weight:700;
font-size:15px;
color:white;
}

.limit-warning{
background:#7f1d1d;
padding:12px;
border-radius:10px;
margin-top:15px;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

<h1>ProtocolMind</h1>

<div class="subtitle">
AI Diplomatic Protocol Assistant
</div>

<div class="credits">
Created and Launched by Ilgar Nuri and Ilkin Mammadov
</div>

<div class="upgrade">
<a href="https://protocolmind.lemonsqueezy.com/checkout/buy/199b0377-48a8-45f8-8f6e-9113caedaff5" target="_blank">
<button>
Upgrade to ProtocolMind Pro
</button>
</a>
</div>

<div id="chatBox" class="chat-box">

<div class="message assistant">
Welcome to ProtocolMind. Ask about diplomatic protocol, official visits, seating plans, protocol checklists, visit programs, official letters, or request a full Protocol Pack.
</div>

</div>

<div class="input-row">

<input id="question" placeholder="Ask about diplomatic protocol...">

<button class="ask-btn" onclick="ask()">
Ask
</button>

<button class="clear-btn" onclick="clearChat()">
Clear
</button>

</div>

<div id="limitWarning"></div>

</div>

<script>

let DAILY_LIMIT = 5

function getTodayKey(){
const today = new Date()
return "requests_" + today.getFullYear()+"_"+today.getMonth()+"_"+today.getDate()
}

function getRequests(){

let key = getTodayKey()

let used = localStorage.getItem(key)

if(!used){
return 0
}

return parseInt(used)

}

function increaseRequests(){

let key = getTodayKey()

let used = getRequests()

localStorage.setItem(key, used + 1)

}

function ask(){

let used = getRequests()

if(used >= DAILY_LIMIT){

document.getElementById("limitWarning").innerHTML = `
<div class="limit-warning">
Daily free limit reached (5 requests). <br><br>
Upgrade to ProtocolMind Pro for unlimited access.
</div>
`

return

}

let input = document.getElementById("question")

let question = input.value.trim()

if(!question){
return
}

addMessage("user",question)

input.value=""

increaseRequests()

fetch("/api/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:question
})

})
.then(res => res.json())
.then(data => {

addMessage("assistant", data.answer || "No response.")

})

}

function addMessage(role,text){

let box = document.getElementById("chatBox")

let div = document.createElement("div")

div.className = "message " + role

div.innerText = text

box.appendChild(div)

box.scrollTop = box.scrollHeight

}

function clearChat(){

document.getElementById("chatBox").innerHTML =
`<div class="message assistant">
Chat cleared.
</div>`

document.getElementById("limitWarning").innerHTML = ""

}

</script>

</body>
</html>
