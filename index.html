<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ProtocolMind</title>

<style>
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
margin:0;
padding:0;
}

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

h1{
text-align:center;
margin-bottom:5px;
}

.subtitle{
text-align:center;
color:#cbd5e1;
margin-bottom:6px;
}

.credits{
text-align:center;
color:#94a3b8;
font-size:13px;
margin-bottom:20px;
}

.controls{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:15px;
flex-wrap:wrap;
}

.language-select{
padding:10px;
border-radius:8px;
border:1px solid #334155;
background:#1e293b;
color:white;
}

.modes{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:10px;
flex-wrap:wrap;
}

.mode-btn{
padding:10px 16px;
border-radius:10px;
border:1px solid #334155;
background:#1e293b;
color:white;
cursor:pointer;
}

.mode-btn.active{
background:#22c55e;
border-color:#22c55e;
}

.mode-label{
text-align:center;
color:#facc15;
margin-bottom:15px;
}

.chat-box{
background:#111827;
border-radius:14px;
border:1px solid #334155;
padding:20px;
min-height:420px;
max-height:520px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:12px;
}

.message{
max-width:80%;
padding:12px;
border-radius:10px;
white-space:pre-wrap;
line-height:1.6;
}

.user{
align-self:flex-end;
background:#2563eb;
}

.assistant{
align-self:flex-start;
background:#1f2937;
border:1px solid #374151;
}

.input-row{
margin-top:15px;
display:flex;
gap:10px;
}

input{
flex:1;
padding:14px;
border-radius:10px;
border:none;
font-size:15px;
}

.ask-btn{
background:#22c55e;
border:none;
padding:14px 18px;
border-radius:10px;
cursor:pointer;
color:white;
}

.clear-btn{
background:#475569;
border:none;
padding:14px 18px;
border-radius:10px;
cursor:pointer;
color:white;
}

.diagram{
margin-bottom:15px;
text-align:center;
}

.seat-row{
display:flex;
justify-content:center;
gap:8px;
margin:6px 0;
}

.seat{
background:#1f2937;
border:1px solid #374151;
padding:8px 10px;
border-radius:6px;
}

.table{
padding:10px 40px;
border:1px solid #334155;
border-radius:8px;
background:#111827;
margin:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>ProtocolMind</h1>
<div class="subtitle">AI Diplomatic Protocol Assistant</div>
<div class="credits">Created and Launched by Ilgar Nuri and Ilkin Mammadov</div>

<div class="controls">
<select id="languageSelect" class="language-select">
<option value="English">English</option>
<option value="Azərbaycan dili">Azərbaycan dili</option>
<option value="Русский">Русский</option>
<option value="Türkçe">Türkçe</option>
</select>
</div>

<div class="modes">
<button class="mode-btn active" onclick="setMode('advice',this)">Protocol Advice</button>
<button class="mode-btn" onclick="setMode('seating',this)">Seating Plan</button>
<button class="mode-btn" onclick="setMode('checklist',this)">Checklist</button>
<button class="mode-btn" onclick="setMode('visit_program',this)">Visit Program</button>
<button class="mode-btn" onclick="setMode('official_letter',this)">Official Letter</button>
</div>

<div class="mode-label" id="modeLabel">
Current mode: Protocol Advice
</div>

<div id="diagramContainer" class="diagram"></div>

<div class="chat-box" id="chatBox">
<div class="message assistant">
Welcome to ProtocolMind. Ask about diplomatic protocol, official visits, seating plans, protocol checklists, visit programs, or official letters.
</div>
</div>

<div class="input-row">
<input id="question" placeholder="Ask about diplomatic protocol...">
<button class="ask-btn" onclick="ask()">Ask</button>
<button class="clear-btn" onclick="clearChat()">Clear</button>
</div>

</div>

<script>
let currentMode="advice";
let conversationHistory=[];

function setMode(mode,el){
currentMode=mode;

document.querySelectorAll(".mode-btn").forEach(btn=>{
btn.classList.remove("active");
});

el.classList.add("active");

const labels={
advice:"Current mode: Protocol Advice",
seating:"Current mode: Seating Plan",
checklist:"Current mode: Checklist",
visit_program:"Current mode: Visit Program",
official_letter:"Current mode: Official Letter"
};

document.getElementById("modeLabel").innerText=labels[mode];
}

function addMessage(role,text){
const chatBox=document.getElementById("chatBox");
const div=document.createElement("div");
div.className="message "+role;
div.innerText=text;
chatBox.appendChild(div);
chatBox.scrollTop=chatBox.scrollHeight;
}

function clearChat(){
conversationHistory=[];
document.getElementById("chatBox").innerHTML=
`<div class="message assistant">Chat cleared.</div>`;
document.getElementById("diagramContainer").innerHTML="";
}

function drawSeatingDiagram(hostCount,guestCount){
const container=document.getElementById("diagramContainer");
container.innerHTML="";

const hostRow=document.createElement("div");
hostRow.className="seat-row";

for(let i=1;i<=hostCount;i++){
const seat=document.createElement("div");
seat.className="seat";
seat.innerText="H"+i;
hostRow.appendChild(seat);
}

const table=document.createElement("div");
table.className="table";
table.innerText="TABLE";

const guestRow=document.createElement("div");
guestRow.className="seat-row";

for(let i=1;i<=guestCount;i++){
const seat=document.createElement("div");
seat.className="seat";
seat.innerText="G"+i;
guestRow.appendChild(seat);
}

container.appendChild(hostRow);
container.appendChild(table);
container.appendChild(guestRow);
}

function detectDelegationNumbers(text){
const numbers=text.match(/\d+/g);
if(!numbers) return null;

if(numbers.length===1){
return {
host:parseInt(numbers[0]),
guest:parseInt(numbers[0])
};
}

return {
host:parseInt(numbers[0]),
guest:parseInt(numbers[1])
};
}

async function ask(){
const input=document.getElementById("question");
const question=input.value.trim();
const language=document.getElementById("languageSelect").value;

if(!question) return;

addMessage("user",question);
conversationHistory.push({role:"user",content:question});
input.value="";

try{
const response=await fetch("/api/ask",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
question,
mode:currentMode,
language,
history:conversationHistory.slice(-10)
})
});

const data=await response.json();
const answer=data.answer||"No answer returned.";

addMessage("assistant",answer);
conversationHistory.push({role:"assistant",content:answer});

if(currentMode==="seating"){
const counts=detectDelegationNumbers(question);
if(counts){
drawSeatingDiagram(counts.host,counts.guest);
}
}

}catch(err){
addMessage("assistant","Request failed: "+err.message);
}
}

document.getElementById("question").addEventListener("keydown",function(e){
if(e.key==="Enter"){
ask();
}
});
</script>

</body>
</html>
