<!DOCTYPE html>
<html>
<head>
  <title>ProtocolMind</title>
  <style>
    body {
      font-family: Arial;
      background:#0f172a;
      color:white;
      text-align:center;
      padding:40px;
    }

    input {
      width:60%;
      padding:12px;
      font-size:16px;
    }

    button {
      padding:12px 20px;
      font-size:16px;
      background:#22c55e;
      border:none;
      color:white;
      cursor:pointer;
    }

    #answer {
      margin-top:30px;
      font-size:18px;
    }
  </style>
</head>

<body>

<h1>ProtocolMind</h1>
<p>AI Diplomatic Protocol Assistant</p>

<input id="question" placeholder="Ask about diplomatic protocol..." />
<button onclick="ask()">Ask</button>

<div id="answer"></div>

<script>

async function ask(){

const question=document.getElementById("question").value;

const response=await fetch("/api/ask",{
method:"POST",
headers:{ "Content-Type":"application/json"},
body:JSON.stringify({question})
});

const data=await response.json();

document.getElementById("answer").innerText=data.answer;

}

</script>

</body>
</html>
